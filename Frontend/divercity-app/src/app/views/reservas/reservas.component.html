<div class="page-container">
  <a routerLink="/" class="btn btn-back">← Volver al inicio</a>

  <div class="form-card">
    <h2>Hacer una reserva</h2>

    <form (ngSubmit)="hacerReserva()" #reservaForm="ngForm">
      <label for="fecha">Fecha</label>
      <input
        type="date"
        id="fecha"
        [(ngModel)]="reserva.fecha"
        name="fecha"
        required
      />

      <label for="hora">Hora</label>
      <input
        type="time"
        id="hora"
        [(ngModel)]="reserva.hora"
        name="hora"
        required
      />

      <label for="numero_personas">Número de personas</label>
      <input
        type="number"
        id="numero_personas"
        [(ngModel)]="reserva.numero_personas"
        name="numero_personas"
        required
        min="1"
      />

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="reservaForm.invalid"
      >
        Reservar
      </button>
    </form>
  </div>
</div>
